name: Send opened pull request email

on:
  workflow_call:
    secrets:
      PR_ALERT_SMTP_HOST:
        required: true
      PR_ALERT_SMTP_PORT:
        required: true
      PR_ALERT_SMTP_USERNAME:
        required: true
      PR_ALERT_SMTP_PASSWORD:
        required: true
      PR_ALERT_FROM:
        required: true
      PR_ALERT_TO:
        required: true

permissions: {}

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR metadata email
        env:
          PR_ALERT_SMTP_HOST: ${{ secrets.PR_ALERT_SMTP_HOST }}
          PR_ALERT_SMTP_PORT: ${{ secrets.PR_ALERT_SMTP_PORT }}
          PR_ALERT_SMTP_USERNAME: ${{ secrets.PR_ALERT_SMTP_USERNAME }}
          PR_ALERT_SMTP_PASSWORD: ${{ secrets.PR_ALERT_SMTP_PASSWORD }}
          PR_ALERT_FROM: ${{ secrets.PR_ALERT_FROM }}
          PR_ALERT_TO: ${{ secrets.PR_ALERT_TO }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = (
              "PR_ALERT_SMTP_HOST",
              "PR_ALERT_SMTP_PORT",
              "PR_ALERT_SMTP_USERNAME",
              "PR_ALERT_SMTP_PASSWORD",
              "PR_ALERT_FROM",
              "PR_ALERT_TO",
          )
          if any(not os.environ.get(name) for name in required):
              raise SystemExit("Required PR-alert SMTP configuration is missing.")

          try:
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file)

              pr = event["pull_request"]
              repository = event["repository"]["full_name"]

              title = (pr.get("title") or "").replace("\r", " ").replace("\n", " ").strip()
              subject = title or "Opened pull request"

              description = (pr.get("body") or "").strip()
              if not description:
                  description = "(no PR description provided)"
              elif len(description) > 10_000:
                  description = (
                      description[:10_000]
                      + "\n\n[PR description truncated at 10,000 characters.]"
                  )

              recipients = [
                  address.strip()
                  for address in os.environ["PR_ALERT_TO"].split(",")
                  if address.strip()
              ]
              if not recipients:
                  raise ValueError("No recipients configured.")

              message = EmailMessage()
              message["From"] = os.environ["PR_ALERT_FROM"]
              message["To"] = "undisclosed-recipients:;"
              message["Subject"] = subject
              message.set_content(
                  "\n".join(
                      (
                          f"Author: {pr['user']['login']}",
                          f"Repo: {repository}",
                          f"PR: {pr['html_url']}",
                          "",
                          description,
                      )
                  )
              )

              context = ssl.create_default_context()
              with smtplib.SMTP(
                  os.environ["PR_ALERT_SMTP_HOST"],
                  int(os.environ["PR_ALERT_SMTP_PORT"]),
                  timeout=30,
              ) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(
                      os.environ["PR_ALERT_SMTP_USERNAME"],
                      os.environ["PR_ALERT_SMTP_PASSWORD"],
                  )
                  smtp.send_message(
                      message,
                      from_addr=message["From"],
                      to_addrs=recipients,
                  )
          except Exception:
              raise SystemExit("PR-alert email delivery failed.")
          PY
